<!DOCTYPE html>
<html lang="da" data-theme="vintage">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍪</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#fdf9ef" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#1b1612" media="(prefers-color-scheme: dark)"/>
    <noscript><style>.recipe-image img{opacity:1!important;transform:none!important}</style></noscript>
    <script nonce="%sveltekit.nonce%">
        // Theme: set data-mode (and the matching theme-color meta) before first paint. Mirrors src/lib/stores/theme.svelte.ts.
        (function () {
            var mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light', forced = false;
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') { mode = saved; forced = true; }
            } catch (e) {}
            document.documentElement.dataset.mode = mode;
            if (forced) {
                var metas = document.querySelectorAll('meta[name="theme-color"]');
                for (var i = 0; i < metas.length; i++) {
                    metas[i].dataset.media = metas[i].media;
                    metas[i].media = metas[i].dataset.media.indexOf(mode) > -1 ? 'all' : 'not all';
                }
            }
        })();
    </script>
    %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
