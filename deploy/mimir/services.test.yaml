services:
  web:
    image:
      tag: "fbf5b255d424f85cdf34db105981c555c4499ab8"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
        visibility: internet
    probes:
      port: http
      liveness:
        path: /
      readiness:
        path: /
