services:
  web:
    image:
      tag: "df500fad576ca4ed7bb3c8dd80698edad635eec9"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
        visibility: internet
    probes:
      port: http
      liveness:
        path: /
      readiness:
        path: /
    env:
      - name: NODE_ENV
        value: production
      - name: HOST
        value: "0.0.0.0"
      - name: PORT
        value: "3000"
      - name: ORIGIN
        value: https://cookiebookie.bybear.dk
