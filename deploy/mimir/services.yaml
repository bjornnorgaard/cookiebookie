services:
  web:
    image:
      tag: "4dd9243ce3efde0827fd46b14d2f49679d8be1de"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
        visibility: internet
    probes:
      port: http
      liveness:
        path: /
      readiness:
        path: /
    env:
      - name: NODE_ENV
        value: production
      - name: HOST
        value: "0.0.0.0"
      - name: PORT
        value: "3000"
