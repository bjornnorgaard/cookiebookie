services:
  web:
    image:
      tag: "b3f240e878aae1675cb210bcfcc057a3d253a7ac"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
        visibility: internet
    probes:
      port: http
      liveness:
        path: /
      readiness:
        path: /
    env:
      - name: NODE_ENV
        value: production
      - name: HOST
        value: "0.0.0.0"
      - name: PORT
        value: "3000"
