services:
  web:
    image:
      tag: "aadf9ba8b018488acbd0bb2aefa56fa16bdb88f0"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
        visibility: internet
    probes:
      port: http
      liveness:
        path: /
      readiness:
        path: /
    env:
      - name: NODE_ENV
        value: production
      - name: HOST
        value: "0.0.0.0"
      - name: PORT
        value: "3000"
