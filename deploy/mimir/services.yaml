services:
  web:
    image:
      tag: "6c761693f2ce6af53477ce589d09f415129b6171"
    ports:
      - name: http
        containerPort: 3000
        servicePort: 3000
        visibility: internet
    probes:
      port: http
      liveness:
        path: /
      readiness:
        path: /
    env:
      - name: NODE_ENV
        value: production
      - name: HOST
        value: "0.0.0.0"
      - name: PORT
        value: "3000"
      - name: ORIGIN
        value: https://cookiebookie.bybear.dk
