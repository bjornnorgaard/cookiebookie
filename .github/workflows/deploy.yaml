name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/bjornnorgaard/cookiebookie

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Bump image tag
        run: |
          sed -i '/^  web:/,/^    ports:/ s/^      tag: .*/      tag: "${{ github.sha }}"/' deploy/mimir/services.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add deploy/mimir/services.yaml
          git diff --staged --quiet || git commit -m "chore: bump web image tag to ${{ github.sha }} [skip ci]"
          git push
