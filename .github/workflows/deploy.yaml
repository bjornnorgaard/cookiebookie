name: Deploy

# PRODUCTION deploy. Whatever lands on main goes to cookiebookie.bybear.dk, mirroring
# Vercel (which also publishes main). Test is separate and explicit:
# scripts/deploy-test.sh <branch|tag|sha>. scripts/deploy.sh is the local fallback
# if Actions is unavailable. Manual run: gh workflow run Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/mimir/**" # tag bumps (ours, prod and test) must not retrigger a deploy
  workflow_dispatch:

# One deploy at a time, in order; never cancel one mid-push.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/bjornnorgaard/cookiebookie

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Bump image tag
        run: |
          git pull -q --rebase origin main # pick up any tag bump pushed while we built
          sed -i '/^  web:/,/^    ports:/ s/^      tag: .*/      tag: "${{ github.sha }}"/' deploy/mimir/services.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add deploy/mimir/services.yaml
          git diff --staged --quiet || git commit -m "chore: bump web image tag (production) to ${{ github.sha }} [skip ci]"
          git push
